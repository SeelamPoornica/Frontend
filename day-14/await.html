<!DOCTYPE html>
<html>
    <head>
        <title>Async and Await</title>
    </head>
    <body>
        <script>
            async function getUsers() {
                try {
                    const response = await fetch("https://jsonplaceholder.typicode.com/users");
                    const data = await response.json();
                    console.log(data);
                } catch (error) {
                    console.log(error);
                }
            }
            getUsers();
        </script>
    </body>
</html>
