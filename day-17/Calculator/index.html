<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card mx-auto p-3" style="width:320px;">
        <h3 class="text-center">Calculator</h3>
        <input type="text"
               id="result"
               class="form-control mb-3"
               readonly>
        <div class="row mb-2">
            <div class="col"><button class="btn btn-secondary w-100" onclick="display('7')">7</button></div>
            <div class="col"><button class="btn btn-secondary w-100" onclick="display('8')">8</button></div>
            <div class="col"><button class="btn btn-secondary w-100" onclick="display('9')">9</button></div>
            <div class="col"><button class="btn btn-warning w-100" onclick="display('/')">/</button></div>
        </div>
        <div class="row mb-2">
            <div class="col"><button class="btn btn-secondary w-100" onclick="display('4')">4</button></div>
            <div class="col"><button class="btn btn-secondary w-100" onclick="display('5')">5</button></div>
            <div class="col"><button class="btn btn-secondary w-100" onclick="display('6')">6</button></div>
            <div class="col"><button class="btn btn-warning w-100" onclick="display('*')">*</button></div>
        </div>
        <div class="row mb-2">
            <div class="col"><button class="btn btn-secondary w-100" onclick="display('1')">1</button></div>
            <div class="col"><button class="btn btn-secondary w-100" onclick="display('2')">2</button></div>
            <div class="col"><button class="btn btn-secondary w-100" onclick="display('3')">3</button></div>
            <div class="col"><button class="btn btn-warning w-100" onclick="display('-')">-</button></div>
        </div>
        <div class="row mb-2">
            <div class="col"><button class="btn btn-secondary w-100" onclick="display('0')">0</button></div>
            <div class="col"><button class="btn btn-secondary w-100" onclick="display('.')">.</button></div>
            <div class="col"><button class="btn btn-success w-100" onclick="calculate()">=</button></div>
            <div class="col"><button class="btn btn-warning w-100" onclick="display('+')">+</button></div>
        </div>
        <div class="row">
            <div class="col">
                <button class="btn btn-danger w-100" onclick="clearDisplay()">
                    Clear
                </button>
            </div>
            <div class="col">
                <button class="btn btn-info w-100" onclick="deleteLast()">
                    Delete
                </button>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
