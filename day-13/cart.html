<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Shop - Cart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">🛒 My Shop</span>
      <div>
        <a href="index.html" class="btn btn-outline-light btn-sm">Home</a>
        <a href="wishlist.html" class="btn btn-outline-light btn-sm">❤ Wishlist</a>
        <a href="cart.html" class="btn btn-outline-light btn-sm">🛍 Cart</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h4 class="mb-3">🛍 Your Cart</h4>

    <div class="card mb-4">
      <div class="list-group list-group-flush" id="cartContainer">
        <!-- cart items will be added here by app.js -->
      </div>
      <div class="card-body">
        <h6 id="cartTotal"></h6>
      </div>
    </div>

    <!-- Address + Place Order -->
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Delivery Address</h5>
        <textarea id="addressInput" class="form-control mb-3" rows="3"
                  placeholder="Enter your full delivery address"></textarea>
        <button class="btn btn-primary w-100" onclick="placeOrder()">
          Place Order
        </button>
      </div>
    </div>
  </div>

  <!-- product.js must load BEFORE app.js because app.js uses the products array -->
  <script src="product.js"></script>
  <script src="app.js"></script>
</body>
</html>
