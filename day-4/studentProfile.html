<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#eef2f7;
        }
        .card{
            width:300px;
            background:white;
            border-radius:15px;
            text-align:center;
            padding:20px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            transition:0.4s;
            cursor:pointer;
        }
        .card img{
            width:120px;
            height:120px;
            border-radius:50%;
            border:4px solid #007bff;
            margin-bottom:15px;
        }
        .card h2{
            color:#333;
            margin-bottom:10px;
        }
        .card p{
            color:#666;
            margin-bottom:20px;
            font-size:18px;
        }
        .card button{
            padding:10px 20px;
            border:none;
            border-radius:25px;
            background:#007bff;
            color:white;
            cursor:pointer;
            transition:0.3s;
        }
        .card button:hover{
            background:#0056b3;
        }
        .card:hover{
            transform:translateY(-10px) scale(1.05);
            box-shadow:0 12px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
<div class="card">
    <img src="OIP.jpg" alt="Student Image">
    <h2>Navya Sri</h2>
    <p>Course: B.Tech - CSE</p>
    <button>View Profile</button>
</div>
</body>
</html>
