<!DOCTYPE html>
<html>
    <head>
        <title>TO DO LIST</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <h2 class="text-center">To Do List</h2>
            <input type="text" id="task" class="form-control" placeholder="Enter task"><br>
            <button class="btn btn-success" onclick="saveTask()">Add task</button>
            <button class="btn btn-danger" onlick="clearTask()">Clear Tasks</button><hr>
            <h4>Task List</h4>
            <ul id="taskList" class="list-group"></ul>
        </div>
        <script src="script.js"></script>
    </body>
</html>
