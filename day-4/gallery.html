<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>
    <style>
        .gallery{
            display:grid;
            grid-template-columns:auto auto auto;
            gap:10px;
            width:650px;
            margin:auto;
        }
        .gallery img{
            width:200px;
            height:150px;
            border:2px solid black;
        }
    </style>
</head>
<body>
<h2 align="center">Photo Gallery</h2>
<div class="gallery">
    <img src="OIP (1).jpg" alt="Photo 1">
    <img src="OIP (2).jpg" alt="Photo 2">
    <img src="OIP (3).jpg" alt="Photo 3">
    <img src="OIP (4).jpg" alt="Photo 4">
    <img src="OIP (3).jpg" alt="Photo 5">
    <img src="OIP (2).jpg" alt="Photo 6">
</div>

</body>
</html>
