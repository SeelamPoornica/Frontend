<!DOCTYPE html>
<html>
<head>
  <title>Spread Operator Example</title>
</head>
<body>
  <script>
    const arr1 = [1, 2, 3];
    const arr2 = [4, 5, 6];
    const combined = [...arr1, ...arr2];
    document.write(combined+"<br>");
    const obj1 = { name: "Medapati", age: 21 };
    const obj2 = { country: "India" };
    const merged = { ...obj1, ...obj2 };
    document.write(merged+"<br>");
  </script>
</body>
</html>
