<!DOCTYPE html>
<html>
<head>
    <title>Pricing Card</title>
    <style>
        body{
            background-color:lightgray;
        }
        .card{
            width:250px;
            background-color:white;
            margin:100px auto;
            padding:20px;
            text-align:center;
            border-radius:10px;
            box-shadow:3px 3px 10px gray;
        }
        button{
            background-color:blue;
            color:white;
            border:none;
            padding:10px;
            width:100px;
            border-radius:5px;
        }
        button:hover{
            background-color:darkblue;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Basic Plan</h2>
    <h1>₹499</h1>
    <p>&#10003; 10 GB Storage</p>
    <p>&#10003; Free Support</p>
    <p>&#10003; 1 User</p>
    <button>Buy Now</button>
</div>
</body>
</html>
